plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.matkaactivity'
version = '0.1.0'

android {
  namespace "expo.modules.matkaactivity"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    // Keeps expo-location's foreground flag, set by reflection (MatkaActivityModule).
    consumerProguardFiles 'consumer-rules.pro'
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Activity Recognition. Same version expo-location already brings in.
  implementation 'com.google.android.gms:play-services-location:21.0.1'
}
