plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.matkaactivity'
version = '0.1.0'

android {
  namespace "expo.modules.matkaactivity"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Activity Recognition. Same version expo-location already brings in.
  implementation 'com.google.android.gms:play-services-location:21.0.1'
  // Location service repair (see MatkaActivityModule): reads and sets expo-location's
  // foreground flag. A compile-time reference, so R8 renames it consistently.
  implementation project(':expo-location')
}
